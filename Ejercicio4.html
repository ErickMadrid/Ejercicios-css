<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Estilos por Clases</title>
    <style>
        /* Definición de las dos clases requeridas en la hoja de estilos */
        .subrayado {
            color: #00aa00;
            text-decoration: underline;
        }

        .tachado {
            color: #00aa00;
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <!-- 1. Título h1 con todo el texto subrayado usando la clase -->
    <h1 class="subrayado">Este es un título completamente subrayado</h1>

    <!-- 2. Párrafo con palabras específicas subrayadas y tachadas usando el elemento span -->
    <p>
        En este párrafo tenemos algunas palabras que están 
        <span class="subrayado">subrayadas</span> y otras palabras que aparecen 
        <span class="tachado">tachadas</span> para cumplir con el ejercicio utilizando el elemento span.
    </p>

</body>
</html>
