<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Herencia en CSS</title>
    <style>
        /* 1. Regla para el elemento body (Color y fuente base) */
        body {
            color: #2c3e50;
            font-family: sans-serif;
        }

        /* 2. Redefinición de fuentes para h1, h2 y h3 respectivamente */
        h1 {
            font-family: 'Times New Roman', Times, serif;
        }

        h2 {
            font-family: 'Courier New', Courier, monospace;
        }

        h3 {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

    <!-- 3. Los tres títulos requeridos -->
    <h1>Título Nivel 1 (Times New Roman)</h1>
    <h2>Título Nivel 2 (Courier)</h2>
    <h3>Título Nivel 3 (Arial)</h3>

    <!-- 4. El párrafo solicitado (Hereda la fuente sans-serif del body) -->
    <p>Este es el párrafo final. Mantiene el color y la fuente del body por herencia.</p>

</body>
</html>
