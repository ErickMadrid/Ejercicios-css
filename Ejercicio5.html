<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5 - Estilos por ID</title>
    <style>
        /* Definición de los tres estilos de tipo id usando el símbolo '#' */
        #cabecera {
            background-color: #34495e;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        #cuerpo {
            background-color: #f8f9fa;
            color: #333333;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        #pie {
            background-color: #2c3e50;
            color: #bdc3c7;
            padding: 15px;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Tres áreas (div) inicializando el atributo id correspondiente -->
    <div id="cabecera">
        <h1>Mi Sitio Web - Cabecera</h1>
    </div>

    <div id="cuerpo">
        <h2>Sección Principal</h2>
        <p>Este es el contenido alojado dentro del área del cuerpo de la página web.</p>
    </div>

    <div id="pie">
        <p>© 2026 Todos los derechos reservados - Pie de página</p>
    </div>

</body>
</html>
